<!doctype html>
<!-- lang 必须保持 en：Komari 注入站点语言时只识别 lang="en"、lang='en' 或根元素
     完全不带 lang 三种写法，写死其他语种会让站点语言设置被静默忽略。 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Komari Monitor</title>
    <meta name="description" content="A simple server monitor tool." />
    <style>
      html, body, #root { margin: 0; min-width: 320px; min-height: 100%; background: #000; }
      #app-boot-splash { position: fixed; inset: 0; z-index: 10000; background: #000; }
    </style>
  </head>
  <body>
    <div id="root"><div id="app-boot-splash" aria-hidden="true"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
